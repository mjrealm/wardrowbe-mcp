name: Publish

# Runs after a pull request merges into main. Publishes the version already in package.json.
# The version bump is part of the pull request itself, so this workflow never pushes to main.
#
# If that version is already on npm, the run skips the publish. Merging a PR that doesn't
# bump the version is safe and does nothing.

on:
  push:
    branches: [main]

permissions:
  contents: write        # push the release tag and create the GitHub release
  id-token: write        # npm trusted publishing (OIDC) and provenance
  pull-requests: read    # look up the merged PR for the commit

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the merged pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Only a merged pull request triggers a release. Direct pushes are skipped.
          merged=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$merged" -gt 0 ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "No merged pull request for $SHA, skipping release."
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.merged == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read package name and version
        if: steps.pr.outputs.merged == 'true'
        id: pkg
        run: |
          echo "name=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already on npm
        if: steps.pr.outputs.merged == 'true'
        id: exists
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm. Bump the version in your pull request to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.pr.outputs.merged == 'true' && steps.exists.outputs.exists == 'false'
        # Install scripts are skipped. Nothing here needs them, and this job holds publish rights.
        run: npm ci --ignore-scripts

      - name: Test
        if: steps.pr.outputs.merged == 'true' && steps.exists.outputs.exists == 'false'
        run: npm test

      - name: Publish to npm
        if: steps.pr.outputs.merged == 'true' && steps.exists.outputs.exists == 'false'
        # Authenticates with the trusted publisher configured on npmjs.com (OIDC), so no token is stored.
        run: npm publish --provenance --access public

      - name: Tag and create the GitHub release
        if: steps.pr.outputs.merged == 'true' && steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
