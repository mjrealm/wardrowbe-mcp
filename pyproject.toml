[project]
name = "wardrowbe-mcp"
version = "0.1.1"
description = "HTTP MCP server for Wardrowbe, with a photo upload endpoint. Meant to run as a pod next to Wardrowbe."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "httpx>=0.27",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
wardrowbe-mcp = "wardrowbe_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wardrowbe_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
